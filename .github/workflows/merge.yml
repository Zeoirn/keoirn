name: PR Merged Celebration

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  congratulate:
    name: Congratulate Contributor
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Post congratulatory comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const author = context.payload.pull_request.user.login;
            const comment = `🎉 **Congratulations @${author} on your contribution to Keoirn!**\n\nThank you for helping improve the project. Your contribution has been merged! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
