name: PR Merged Celebration

on:
  pull_request_target:
    types: [closed]

jobs:
  congratulate:
    name: Congratulate Contributor
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Post congratulatory comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const comment = `🎉 **Congratulations @${author} on your contribution to Keoirn!**\n\nThank you for helping improve the project. Your contribution has been merged! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
