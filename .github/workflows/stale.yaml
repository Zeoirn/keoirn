name: Stale

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/stale@v9
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-close: 7
          stale-issue-message: "This issue has been marked as stale due to 30 days of inactivity. It will be closed in 7 days if no further activity occurs. Comment on this issue to keep it open."
          stale-pr-message: "This pull request has been marked as stale due to 14 days of inactivity. It will be closed in 7 days if no further activity occurs. Comment on this PR to keep it open."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "no-stale,pinned,security"
          exempt-pr-labels: "no-stale,pinned,security"
