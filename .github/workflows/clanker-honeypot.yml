name: Clanker Honeypot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  filter-ai-pr:
    name: Filter out AI-generated PRs
    runs-on: ubuntu-latest

    steps:
      - name: Check title for AI canary word
        uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Must match the tag in AGENTS.md
            const tag = "(luau-preflight)";
            const title = (process.env.PR_TITLE || "").toLowerCase();

            if (!title.includes(tag)) {
              return;
            }

            const body = [
              "### ⛔ AI-Generated Pull Request Denied",
              "",
              "In accordance with this repository's [`AGENTS.md`](./AGENTS.md) policy, we do not accept automated or AI-generated pull requests.",
              "",
              "All contributions to **Keoirn** must be manually written, inspected, and tested in Roblox Studio or a Luau runtime by human contributors.",
              "",
              "This pull request has been automatically closed."
            ].join("\n");

            // Post policy rejection comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

            // Try to assign labels (creates if missing or skips if label error)
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ["invalid"]
              });
            } catch (err) {
              console.log("Could not attach label:", err.message);
            }

            // Close the PR
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed"
            });
