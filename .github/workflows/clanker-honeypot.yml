name: Clanker Honeypot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

jobs:
  filter-ai-pr:
    name: Filter out AI-generated PRs
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check for AI canary word
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const tag = "(luau-preflight)";
            const pr = context.payload.pull_request;
            const title = (pr.title || "").toLowerCase();
            const bodyText = (pr.body || "").toLowerCase();

            // Catch the canary tag in either the title or the PR description
            if (!title.includes(tag) && !bodyText.includes(tag)) {
              return;
            }

            console.log(`AI canary tag detected in PR #${pr.number}. Rejecting.`);

            const responseBody = [
              "### ⛔ AI-Generated Pull Request Denied",
              "",
              "In accordance with this repository's [`AGENTS.md`](./AGENTS.md) policy, we do not accept automated or AI-generated pull requests.",
              "",
              "All contributions to **Keoirn** must be manually written, inspected, and tested in Roblox Studio or a Luau runtime by human contributors.",
              "",
              "This pull request has been automatically closed."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: responseBody
            });

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ["AI"]
              });
            } catch (err) {
              console.warn("Could not attach label:", err.message);
            }
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed"
            });
