name: Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-validation
  cancel-in-progress: true

jobs:
  luau-check:
    name: Luau & Selene Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Official Luau Static Analyzer (luau-lang/luau)
      - name: Install Luau
        run: |
          curl -sL https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip -o /tmp/luau.zip
          sudo unzip -o /tmp/luau.zip luau-analyze -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/luau-analyze

      - name: Run luau-analyze
        run: luau-analyze --mode=strict *.lua
        continue-on-error: true # Keep true until existing Luau type warnings are cleaned up

      # 2. Selene Linter (using the valid action)
      - name: Run Selene
        uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: "--display-style quiet ."
        continue-on-error: true

  web-check:
    name: Validate Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check HTML/JS/CSS formatting
        run: npx prettier --check "*.{html,js,css}"
