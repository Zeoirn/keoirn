name: Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.lua"
      - "**/*.luau"
      - ".github/workflows/validation.yml"
  push:
    branches: [main]
    paths:
      - "**/*.lua"
      - "**/*.luau"
      - ".github/workflows/validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-validation
  cancel-in-progress: true

jobs:
  luau-check:
    name: Validate Luau & Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Official Luau Static Analyzer
      - name: Install Luau
        run: |
          curl -sL https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip -o /tmp/luau.zip
          sudo unzip -o /tmp/luau.zip luau-analyze -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/luau-analyze

      - name: Run luau-analyze
        run: |
          # Finds and checks all .lua and .luau files in the repository
          find . -type f \( -name "*.lua" -o -name "*.luau" \) ! -path "*/.*/*" | xargs -r luau-analyze
        continue-on-error: true # Keep true until existing diagnostics are cleaned up

      # 2. Selene Linter (fixed action repository)
      - name: Run Selene
        uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: "--display-style quiet ."
        continue-on-error: true
