name: Prettier & Minify

on:
  push:
    branches: [main]
    paths:
      - ".github/.prettierrc"
      - ".github/.prettierrc.json"
      - ".github/workflows/prettier.yml"
      - "script.js"
      - "style.css"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  prettify-and-minify:
    name: Prettify & Minify Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID || vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format, Minify, and Open PR
        run: |
          set -euo pipefail
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          BRANCH="assets-build-$(date +%s)"
          git checkout -b "$BRANCH"

          # 1. Clean up duplicate workflows if present
          rm -f .github/workflows/stale.yaml .github/workflows/ci-bypass.yml .github/workflows/validation.yml

          # 2. Format files with Prettier
          npx --yes prettier@latest --config .github/.prettierrc.json --ignore-path .github/.prettierignore --write "**/*.{html,js,css,json,md,yml,yaml}"

          # 3. Minify JavaScript and CSS assets
          if [ -f "script.js" ]; then
            npx --yes esbuild script.js --minify --outfile=script.min.js
          fi
          if [ -f "style.css" ]; then
            npx --yes esbuild style.css --minify --outfile=style.min.css
          fi

          if git diff --quiet && git diff --cached --quiet; then
            echo "No formatting or minification changes needed."
            exit 0
          fi

          git add -A
          COUNT=$(git status -s -uno | wc -l)
          git commit -m "style: format code, minify assets, and tighten workflows"
          git push --set-upstream origin "$BRANCH"
          gh pr create -t "style: format code and update minified assets" -b "$COUNT file(s) formatted and minified."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
