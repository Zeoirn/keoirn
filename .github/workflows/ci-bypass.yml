name: CI Bypass & Reviewer Assignment

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  assign-reviewer:
    name: Assign zurai02 on ci: bypass
    if: startsWith(github.event.pull_request.title, 'ci:') || contains(github.event.pull_request.title, 'ci:')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Request review from zurai02
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviewer = 'zurai02';

            console.log(`Detected 'ci:' in PR #${pr.number} title: "${pr.title}"`);

            // Skip review request if zurai02 is the author
            if (pr.user.login.toLowerCase() === reviewer.toLowerCase()) {
              console.log(`${reviewer} authored this PR; skipping reviewer request.`);
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: [reviewer]
              });
              console.log(`Successfully assigned ${reviewer} as reviewer.`);
            } catch (error) {
              console.warn(`Reviewer request warning: ${error.message}`);
            }
