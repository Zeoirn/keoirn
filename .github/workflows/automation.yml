name: PR Automation

on:
  pull_request_target:
    types: [opened, labeled]

jobs:
  welcome-comment:
    if: >
      github.event_name == 'pull_request_target' && 
      github.event.action == 'opened' && 
      !contains(github.event.pull_request.title, '(luau-preflight)')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Comment on new PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "👋 Thanks for opening this PR! A maintainer will review it shortly. It will be merged once it is labeled `approved`, or closed if labeled `invalid`."
            });

  handle-label:
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Triggered when 'approved' label is added -> auto merges PR
      - name: Merge on approved
        if: github.event.label.name == 'approved'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                merge_method: "squash"
              });
            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `⚠️ **Could not auto-merge:** ${error.message}\n\nPlease check for merge conflicts or failing status checks.`
              });
            }

      # Triggered when 'invalid' or 'invalid: reason' label is added -> closes PR
      - name: Close on invalid
        if: startsWith(github.event.label.name, 'invalid')
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const label = context.payload.label.name;
            const reason = label.includes(":") ? label.split(":").slice(1).join(":").trim() : "";
            const detail = reason ? ` (${reason})` : "";
            const body = `Your PR was not merged because it was marked as invalid${detail}. Feel free to ask questions or submit an updated PR once resolved.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed"
            });
