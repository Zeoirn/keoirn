name: PR Automation

on:
  pull_request_target:
    types: [opened, labeled]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  welcome-comment:
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "👋 Thanks for opening this PR! A maintainer will review it shortly. It will be merged once it is labeled `approved`, or closed if labeled `invalid`."
            });

  handle-label:
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Merge on approved
        if: github.event.label.name == 'approved'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: "squash"
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "🎉 **Pull Request Merged!**\n\nThank you for your contribution to Keoirn!"
            });

      - name: Close on invalid
        if: startsWith(github.event.label.name, 'invalid')
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = context.payload.label.name;
            const reason = label.includes(":") ? label.split(":").slice(1).join(":").trim() : "";
            const detail = reason ? ` (${reason})` : "";
            const body = `Your PR was not merged because it was marked as invalid${detail}. Feel free to ask questions or submit an updated PR once resolved.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed"
            });
